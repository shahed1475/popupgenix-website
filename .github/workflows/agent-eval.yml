name: Agent checks
on:
  pull_request:
    paths: ["knowledge/**", "agent/**", "functions/**", "scripts/build-knowledge.mjs", "src/lib/site.ts"]
  push:
    branches: [main]
    paths: ["knowledge/**", "agent/**", "functions/**", "scripts/build-knowledge.mjs", "src/lib/site.ts"]
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - name: Rebuild facts and check the committed copy is current
        run: |
          npm run knowledge
          git diff --exit-code agent/generated/knowledge.json
      - name: Typecheck agent code
        run: npx tsc -p tsconfig.agent.json --noEmit
      - name: Unit tests and offline eval (42 cases)
        run: npx vitest run agent
