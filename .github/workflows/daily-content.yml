name: Daily content agent
on:
  schedule:
    - cron: "17 13 * * *"   # every day, 13:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Draft only, do not send to WordPress"
        default: "true"
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests playwright && playwright install --with-deps chromium
      - name: Draft, render and upload
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WPCOM_TOKEN: ${{ secrets.WPCOM_TOKEN }}
          POST_STATUS: ${{ vars.POST_STATUS || 'draft' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python scripts/daily_post.py
