name: Daily content agent
on:
  schedule:
    - cron: "7 0 * * *"   # every day just after 00:00 UTC, when the Workers AI free Neuron quota resets
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Draft only, do not send to WordPress"
        default: "true"
permissions:
  contents: read
concurrency:
  group: daily-content
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - name: Build facts and validator bundle
        run: npm run knowledge && npm run agent:bundle
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests playwright && playwright install --with-deps chromium
      - name: Draft, validate, render and upload
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WPCOM_TOKEN: ${{ secrets.WPCOM_TOKEN }}
          POST_STATUS: ${{ vars.POST_STATUS || 'draft' }}
          COVER_BG: ${{ vars.COVER_BG || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python scripts/daily_post.py
      - name: Keep the dry-run draft
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-draft
          path: |
            daily-draft.html
            daily-cover.png
          if-no-files-found: ignore
