# docker-compose.yml (repo root)
services:
  drickly-db:
    image: postgres:15-alpine
    container_name: drickly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: drickly
      POSTGRES_USER: drickly_app
      POSTGRES_PASSWORD: ${DRICKLY_DB_PASSWORD}
    volumes:
      - drickly-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drickly_app -d drickly"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - drickly

  drickly-api:
    build: ./server
    container_name: drickly-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://drickly_app:${DRICKLY_DB_PASSWORD}@drickly-db:5432/drickly
      JWT_SECRET: ${DRICKLY_JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      NODE_ENV: production
    depends_on:
      drickly-db:
        condition: service_healthy
    networks:
      - drickly

  # Not a long-running server — invoked on demand, e.g.:
  #   docker compose run --rm drickly-worker npm run task:research
  #   docker compose run --rm drickly-worker npm run task:lead_finder
  #   docker compose run --rm drickly-worker npm run enqueue-csv-import -- <org-id> <source-id> <csv-path>
  # `docker compose up`/`up -d --build` will build and briefly start it (it prints a
  # message and exits 0) but never runs a real task on its own — no restart policy, no cron
  # wired up here. Scheduling automation is a separate, later decision.
  drickly-worker:
    build: ./worker
    container_name: drickly-worker
    environment:
      WORKER_DATABASE_URL: postgresql://drickly_app:${DRICKLY_DB_PASSWORD}@drickly-db:5432/drickly
      AI_PROVIDER: ${WORKER_AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    depends_on:
      drickly-db:
        condition: service_healthy
    networks:
      - drickly

  drickly-frontend:
    build: .
    container_name: drickly-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - drickly-api
    networks:
      - drickly

networks:
  drickly:
    name: drickly
    driver: bridge

volumes:
  drickly-db-data:
    name: drickly-db-data
