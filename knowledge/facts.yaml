# PopupGenix knowledge base: the single source of truth for the chat agent and the
# daily content agent. Edit THIS file, then run `npm run knowledge` (also runs on
# every build). Nothing the agents say about prices, clients or contact details may
# come from anywhere else; the output validator blocks anything not listed here.
#
# Keep it consistent with src/lib/site.ts (a test checks the key facts).

company:
  name: PopupGenix
  founded: 2024
  location: Albuquerque, NM, USA
  founder: Abdullah Al Fahad
  summary: >-
    PopupGenix is a founder-led AI and software studio in Albuquerque, NM (founded 2024).
    It builds AI agents, data and predictive-analytics products, custom software and SaaS
    platforms, websites, mobile apps, CRM tools, workflow automation and cloud/DevOps for
    growing businesses worldwide. It also builds and runs its own products.

contact:
  email: hello@popupgenix.com
  email_alt: popupitcompany@gmail.com
  phone: "+1 479 689 1012"
  website: https://popupgenix.com
  form_path: /contact
  reply_time: Within one business day
  booking_url: ""          # set when a Cal.com / Calendly link exists

pricing:
  starter:
    price: "$500"
    cadence: per month
    what: Ongoing development and automation hours for small teams, with weekly progress updates and email support.
  project:
    price: Custom quote
    what: A defined build such as an AI agent, portal or website. Discovery and a written scope come first, then design, build and launch, with 30-day post-launch support. The client owns the code.
  enterprise:
    price: Custom
    what: Larger platforms, multi-tenant products and long-term partnerships, with a dedicated team and roadmap.
  rules:
    - Only the $500 per month Starter price is published. Everything else is a custom quote after a short call.
    - The assistant never invents prices, discounts, free trials, guarantees or delivery dates.

