faq:
  - id: faq-ownership
    keywords: [own, ownership, code, source, license, rights, lock-in]
    text: Clients own the source code and the infrastructure accounts it runs on.
  - id: faq-existing-code
    keywords: [existing, codebase, takeover, take over, legacy, audit, fix, rescue, inherit]
    text: Existing codebases and setups can be audited, stabilised and extended. The audit comes first and the highest-risk issues are fixed first.
  - id: faq-privacy
    keywords: [privacy, data, safe, safety, security, secure, gdpr, confidential, training, trust, private]
    text: >-
      Systems are designed around the client's data policies. Only the minimum data is sent to third-party
      models, role-based access and audit logs are standard in custom platforms, and self-hosted models can be
      used where required. Specific compliance requirements are reviewed on the discovery call.
  - id: faq-mistakes
    keywords: [mistakes, wrong, accuracy, accurate, hallucinate, hallucination, errors, reliable, trust, human, handover, handoff]
    text: >-
      AI agents are grounded in the client's own documents, tested against real enquiries before launch, and
      given clear handover rules so a human takes over for sensitive or complex requests. Where a plain rule is
      more reliable than AI, a rule is used.
  - id: faq-tools
    keywords: [tools, integrations, integrate, crm, calendar, email, whatsapp, api, connect, hubspot, salesforce, zapier]
    text: Common CRMs, calendars, email and WhatsApp are standard integrations. If a tool has an API, it can usually be connected. Specific tools are confirmed on the discovery call.
  - id: faq-timeline
    keywords: [how long, timeline, deadline, weeks, delivery, deliver, ready, when, fast, quickly, urgent]
    text: >-
      Timelines are set in the written scope after a discovery call, because they depend on the project. A
      focused website chat agent can usually be live within a few weeks. The assistant cannot promise a
      delivery date; a human confirms timelines.
  - id: faq-where
    keywords: [where, location, based, office, country, timezone, remote, worldwide, albuquerque]
    text: PopupGenix is based in Albuquerque, NM, USA, and works with clients worldwide.
  - id: faq-team
    keywords: [team, who, founder, ceo, abdullah, people, size, staff]
    text: PopupGenix is founder-led. Abdullah Al Fahad is the founder and CEO. Work is done by a small team under his direction.
  - id: faq-support
    keywords: [support, maintenance, retainer, after launch, post-launch, warranty, bug, help]
    text: Project work includes 30-day post-launch support. Optional monthly retainers (such as the $500 per month Starter plan) cover ongoing improvements and maintenance.
  - id: faq-ml
    keywords: [machine learning, ml, model, train, training, fine-tune, finetune, fine tune, computer vision, deep learning, mlops, predictive, neural, data science]
    text: >-
      PopupGenix builds AI data analysis and predictive-reporting products (Clarify AI and Klevere AI), and
      language-model features that answer from a client's own documents (BlackGPT). Computer vision, custom
      model training and MLOps are not listed services, so anything beyond that is a question for the team.
  - id: faq-ai-or-not
    keywords: [should, need, ai, necessary, worth, right fit, automation or ai, rule]
    text: AI is not always the answer. If a simple rule or script does the job reliably, PopupGenix says so and uses that. AI is added where it measurably helps.

# Phrases the assistant must never state or imply.
forbidden_claims:
  - Any client name that is not in allow.names (for example big-brand or invented clients).
  - Any price other than $500 per month for Starter.
  - Discounts, free trials, free audits, guarantees, refunds or money-back promises.
  - Specific delivery dates or fixed timelines.
  - Statistics, revenue figures, conversion numbers or awards about PopupGenix's own work.
  - That Inno AI or the AI Sales Employee are live or finished.
  - That the assistant can sign contracts, take payment or make binding promises.
  - That PopupGenix offers computer vision, custom model training or fine-tuning, MLOps or voice agents as listed services (voice agents are scoped after a discovery call).
  - That the company is only a lead-generation or marketing business.

# Positioning: used to shape answers about value, never to quote competitor prices.
positioning:
  - PopupGenix is a founder-led AI and software studio. It builds AI agents, data and predictive-analytics products, SaaS platforms, web and mobile apps and automation, and runs its own products.
  - Lead generation is one product (AutoLead Manager) and one service line (AI sales agents), not the whole company.
  - Lead with fit and outcome (less manual work, clearer data, software that fits the business), not with price.
  - Say what a system does in plain verbs. Name limits. Machine learning is limited to predictive reporting and AI data analysis; computer vision, custom model training and MLOps are not listed services.
  - Never compare against or quote named competitors' prices.

# Audience objections and the grounded answer the assistant should follow.
objections:
  - id: obj-data-safety
    keywords: [data, safe, security, private, customer data, secure]
    text: See the data and privacy answer. Offer a call to review specific requirements.
  - id: obj-accuracy
    keywords: [wrong, mistakes, accuracy, trust, hallucinate]
    text: See the mistakes answer. Agents are grounded in the client's documents and hand off to a human for anything sensitive.
  - id: obj-expertise
    keywords: [expertise, technical, setup, difficult, complicated, ourselves, non-technical]
    text: PopupGenix does the setup end to end (design, build, launch, handover), so the client's team does not need technical expertise.
  - id: obj-roi
    keywords: [roi, expensive, cost, worth, budget, cheap, cheaper, afford]
    text: >-
      Frame value as removing manual work and building software that fits how the business runs. State the $500 per month
      Starter plan and that project work is a custom quote after a short call. Do not invent savings figures.

# Statistics the DAILY CONTENT AGENT may cite, always with the source named and
# framed as directional. The chat agent does not quote these.
stats:
  - id: stat-oldroyd
    claim: >-
      A Lead Response Management study by Dr. James Oldroyd (MIT Sloan) with InsideSales.com found the odds
      of contacting a lead fall sharply as response time grows beyond the first few minutes.
    source: Lead Response Management Study (Oldroyd / InsideSales.com)
    allow_numbers: []
  - id: stat-census-sales
    claim: >-
      In US Census Bureau research, sales and marketing is the most common business function where
      AI-using firms apply it.
    source: US Census Bureau, CES working paper CES-WP-26-25
    allow_numbers: []

