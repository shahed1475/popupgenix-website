services:
  - id: ai-automation
    name: AI and Automation
    keywords: [automation, automate, workflow, n8n, document, processing, reporting, extraction, classification, summarisation, summarization, repetitive, manual, data entry, zapier, machine learning, ml, predictive, prediction, forecast, analysis, analytics, llm, rag, model]
    text: >-
      Workflow automation and practical AI features: document processing, reporting, AI data analysis,
      predictive reporting on business data, and language-model features that answer from the client's own
      documents. A process audit comes first. AI is only used where it measurably helps; if a plain rule or
      script does the job, that is used instead. Includes error handling, monitoring, evaluation on real data
      and a support window after go-live. Data privacy is designed in, and self-hosted models can be used
      where required.
  - id: ai-sales-agents
    name: AI Sales Agents
    keywords: [ai, agent, chatbot, bot, sales, lead, qualify, qualification, booking, book, voice, whatsapp, receptionist, answer, calls, crm, calendar, follow-up, followup]
    text: >-
      AI sales agents answer every enquiry instantly on your website, WhatsApp or phone, qualify leads
      against your own criteria, book meetings into your calendar, and log summaries in your CRM. A human
      takes over for anything sensitive. Built for service businesses, agencies, clinics, real estate teams
      and B2B companies that lose leads to slow follow-up. A focused website chat agent can usually be live
      within a few weeks; voice and multi-channel agents are scoped after a discovery call.
  - id: custom-software
    name: Custom Software
    keywords: [custom, software, platform, saas, internal, tool, dashboard, billing, ordering, spreadsheet, build, product, mvp, code, own]
    text: >-
      Custom web platforms, internal tools, dashboards and SaaS products designed around how the business
      works. Discovery and a written scope come before any build. Includes database design, API, admin
      dashboard, authentication and roles, automated tests and documented deployment. The client owns the
      source code and the infrastructure accounts. Existing codebases can be audited and extended.
  - id: web-development
    name: Web Development
    keywords: [website, web, site, landing, seo, redesign, cms, blog, wordpress, fast, speed, accessibility, marketing, ecommerce, shop, store]
    text: >-
      Fast, accessible, search-friendly websites and web apps. Includes a design system, responsive layouts,
      SEO metadata, sitemap and structured data, CMS or WordPress blog integration, analytics, and deployment.
      Redesigns keep what already ranks and converts. Content can be edited by the client's own team.
  - id: mobile-apps
    name: Mobile Apps
    keywords: [mobile, app, ios, android, iphone, flutter, react native, expo, cross-platform, store, push, notification]
    text: >-
      Cross-platform iOS and Android apps from one codebase using React Native and Expo, with a secure backend,
      push notifications, analytics and App Store and Google Play submission support. Native is only
      recommended when the product genuinely needs it. Flutter and fully native Swift or Kotlin apps are not
      listed services.
  - id: crm-saas
    name: CRM and SaaS Tools
    keywords: [crm, saas, portal, client portal, subscription, multi-tenant, billing, roles, analytics, lead management, integrate, integration]
    text: >-
      CRMs, client portals, lead-management systems and subscription products with multi-tenant architecture,
      role-based access, billing and plan management, email notifications and activity logs. Can integrate
      with the CRM a client already uses, or replace it.
  - id: cloud-devops
    name: Cloud and DevOps
    keywords: [cloud, devops, ci, cd, deployment, deploy, docker, monitoring, infrastructure, aws, gcp, cloudflare, terraform, pipeline, backup, hosting]
    text: >-
      CI/CD pipelines, Docker and environment configuration, monitoring and alerting, backup and recovery
      plans, and cost-aware cloud infrastructure on Cloudflare, AWS or GCP. Existing setups can be taken over
      after an audit that fixes the highest-risk issues first.

process:
  - id: process
    keywords: [process, how, work, steps, timeline, scope, workflow, weekly, updates, start, begin, onboarding, discovery, launch, support]
    text: >-
      Five steps. Discover: a short call to understand goals and where time or leads are lost, then a written
      scope and a fixed or phased quote. Design: flows, data and interface mapped and signed off before
      building. Build: small visible increments with automated tests, code review and weekly updates. Launch:
      deployment, monitoring and a handover session. Support: a support window after launch and optional
      monthly retainers. Clients own the code.

